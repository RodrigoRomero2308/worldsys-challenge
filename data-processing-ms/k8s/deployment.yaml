apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processing-ms-deployment
  namespace: default
  labels:
    app: data-processing-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-processing-ms
  template:
    metadata:
      labels:
        app: data-processing-ms
    spec:
      containers:
      - name: data-processing-ms-container
        image: worldsys-data-processing-ms:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: data-processing-ms-config
        - secretRef:
            name: data-processing-ms-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
